<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Christina Tyagi — Neuroscience Researcher, Stanford University" />
  <title>Christina Tyagi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>

    /* ── TOKENS ── */
   :root {
    --bg:       #F0EDF5;   /* subtle purple-tinted white */
    --white:    #ffffff;
    --border:   #E2DCF0;
  
    --ink:      #1a1818;
    --ink-2:    #4a4650;
    --ink-3:    #9690a0;
  
    /* Primary Accent */
    --green:    #6B5B8E;   /* muted purple */
    --green-bg: #EDE8F5;   /* soft purple background */
    
    --nav-h:    58px;
    --max:      740px;
    --serif:    'Lora', Georgia, serif;
    --sans:     'Inter', system-ui, sans-serif;
  }

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body { 
      font-family: var(--sans); 
      background: var(--bg); 
      color: var(--ink); 
      line-height: 1.7; 
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }
    ::selection { background: var(--green); color: #fff; }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: rgba(237, 232, 245, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid transparent;
      z-index: 100;
      transition: border-color .2s;
    }
    nav.scrolled { border-bottom-color: var(--border); }
    .nav-inner {
      max-width: calc(var(--max) + 4rem);
      margin: 0 auto; padding: 0 2rem;
      height: 100%; display: flex; align-items: center; justify-content: space-between;
    }
    .nav-name { font-family: var(--serif); font-size: .95rem; font-weight: 500; white-space: nowrap; margin-right: 2rem; }
    .nav-links { display: flex; gap: .1rem; }
    .nav-links a {
      font-size: .78rem; font-weight: 500; letter-spacing: .05em; text-transform: uppercase;
      color: var(--ink-3); padding: .4rem .6rem; border-radius: 5px;
      transition: color .15s, background .15s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--green); background: var(--green-bg); }

    /* mobile nav */
    .nav-toggle { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 4px; }
    .nav-toggle span { display: block; width: 20px; height: 2px; background: var(--ink); border-radius: 2px; transition: transform .25s, opacity .2s; }
    .nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .mobile-menu {
      display: none; position: fixed; top: var(--nav-h); left: 0; right: 0;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 1rem 2rem 1.5rem; z-index: 99;
      animation: fadeDown .15s ease;
    }
    .mobile-menu.open { display: block; }
    .mobile-menu a { display: block; padding: .55rem .5rem; font-size: .9rem; color: var(--ink-2); border-radius: 5px; transition: background .15s; }
    .mobile-menu a:hover { background: var(--green-bg); color: var(--green); }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    /* ── PAGE WRAPPER ── */
    main { max-width: var(--max); margin: 0 auto; padding: 0 2rem; }

    /* ── SECTIONS ── */
    section { padding: 4rem 0; border-bottom: 1px solid var(--border); }
    section:last-child { border-bottom: none; }

    .sec-label {
      font-family: var(--sans); font-size: .7rem; font-weight: 500;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--green); margin-bottom: 1.25rem; display: block;
    }
    h2 { font-family: var(--serif); font-size: 1.45rem; font-weight: 500; color: var(--ink); margin-bottom: 1rem; }

    /* ── HERO ── */
    #about { padding-top: calc(var(--nav-h) + 3.5rem); padding-bottom: 4rem; }
    .hero-container {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    .hero-image {
      width: 100%;
      max-width: 200px;
      margin: 0 auto;
    }
    .hero-image img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
    }
    .hero-content {
      flex: 1;
    }
    .hero-name {
      font-family: var(--serif);
      font-size: clamp(2.4rem, 5vw, 3.4rem);
      font-weight: 500; line-height: 1.1;
      color: var(--ink); margin-bottom: 1.25rem;
    }
    .hero-name em { font-style: italic; color: var(--green); }
    .hero-sub { font-size: .85rem; color: var(--ink-3); margin-bottom: 1.75rem; }
    .hero-bio { font-size: 1rem; color: var(--ink-2); line-height: 1.85; font-weight: 300; max-width: 52ch; margin-bottom: 2rem; }
    .hero-bio strong { color: var(--ink); font-weight: 500; }
    .hero-link { display: inline-flex; align-items: center; gap: .4rem; font-size: .875rem; font-weight: 500; color: var(--green); border: 1.5px solid var(--green); padding: .55rem 1.1rem; border-radius: 6px; transition: background .15s, color .15s; }
    .hero-link:hover { background: var(--green); color: #fff; }

    /* ── INTERESTS ── */
    .interests { display: flex; flex-direction: column; gap: .75rem; }
    .interest { display: flex; align-items: baseline; gap: .75rem; }
    .interest-dot { width: 5px; height: 5px; background: var(--green); border-radius: 50%; flex-shrink: 0; margin-top: .6rem; }
    .interest p { font-size: .95rem; color: var(--ink-2); font-weight: 300; line-height: 1.6; }
    .interest strong { color: var(--ink); font-weight: 500; }

    /* ── SPOTLIGHT ── */
    .section-image-wrap {
      width: 100%;
      margin-top: 1.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--white);
    }
    .section-image-wrap iframe {
      width: 100%;
      height: 600px;
      border: none;
      display: block;
    }

    /* ── EXPERIENCE ── */
    .exp-list { display: flex; flex-direction: column; gap: 2.5rem; }
    .exp-header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: .25rem; flex-wrap: wrap; }
    .exp-role { font-family: var(--serif); font-size: 1.1rem; font-weight: 500; color: var(--ink); }
    .exp-date { font-size: .78rem; color: var(--ink-3); white-space: nowrap; }
    .exp-org { font-size: .88rem; color: var(--green); font-weight: 500; margin-bottom: .2rem; }
    .exp-adv { font-size: .82rem; color: var(--ink-3); font-style: italic; margin-bottom: .85rem; }
    .exp-bullets { display: flex; flex-direction: column; gap: .5rem; }
    .exp-bullets li { font-size: .9rem; color: var(--ink-2); line-height: 1.7; font-weight: 300; padding-left: 1.1rem; position: relative; }
    .exp-bullets li::before { content: '–'; position: absolute; left: 0; color: var(--ink-3); }

    /* ── PUBLICATIONS ── */
    .pub-year { font-size: .7rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 2rem; margin-bottom: .85rem; padding-bottom: .5rem; border-bottom: 1px solid var(--border); }
    .pub-year:first-child { margin-top: 0; }
    .pub-list { display: flex; flex-direction: column; gap: .85rem; }
    .pub { display: flex; gap: .85rem; align-items: flex-start; }
    .pub-badge {
      font-size: .63rem; font-weight: 500; letter-spacing: .05em; text-transform: uppercase;
      padding: 2px 6px; border-radius: 4px; flex-shrink: 0; margin-top: 2px;
      white-space: nowrap;
    }
    .b-prep { background: #F5EDEE; color: #6B5B8E; }
    .b-pre  { background: #F2F5ED; color: #6B5B8E; }
    .b-jnl  { background: var(--green-bg); color: var(--green); }
    .pub-text { font-size: .88rem; color: var(--ink-2); line-height: 1.65; font-weight: 300; }
    .pub-text strong { color: var(--ink); font-weight: 500; }
    .pub-text em { font-style: italic; }
    .pub-doi { display: inline-block; margin-top: .2rem; font-size: .78rem; color: var(--ink-3); transition: color .15s; }
    .pub-doi:hover { color: var(--green); }

    /* ── PRESENTATIONS ── */
    .pres-list { display: flex; flex-direction: column; }
    .pres { display: flex; gap: 1.25rem; padding: .9rem 0; border-bottom: 1px solid var(--border); }
    .pres:last-child { border-bottom: none; }
    .pres-yr { font-size: .8rem; color: var(--ink-3); flex-shrink: 0; padding-top: .15rem; width: 36px; }
    .pres-body { flex: 1; }
    .pres-venue { display: block; font-size: .72rem; color: var(--green); letter-spacing: .04em; margin-bottom: .3rem; }
    .pres-text { font-size: .88rem; color: var(--ink-2); line-height: 1.65; font-weight: 300; }
    .pres-text strong { color: var(--ink); font-weight: 500; }
    .pres-text em { font-style: italic; }
    .pres-link { display: inline-block; margin-top: .25rem; font-size: .78rem; color: var(--ink-3); transition: color .15s; }
    .pres-link:hover { color: var(--green); }

    /* ── MENTORING ── */
    .mentor-list { display: flex; flex-direction: column; gap: 2rem; }
    .mentor-header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: .2rem; }
    .mentor-role { font-family: var(--serif); font-size: 1.05rem; font-weight: 500; }
    .mentor-date { font-size: .78rem; color: var(--ink-3); }
    .mentor-org { font-size: .88rem; color: var(--green); font-weight: 500; margin-bottom: .75rem; }
    .mentor-bullets { display: flex; flex-direction: column; gap: .45rem; }
    .mentor-bullets li { font-size: .9rem; color: var(--ink-2); line-height: 1.7; font-weight: 300; padding-left: 1.1rem; position: relative; }
    .mentor-bullets li::before { content: '–'; position: absolute; left: 0; color: var(--ink-3); }

    /* ── SKILLS ── */
    .skill-rows { display: flex; flex-direction: column; gap: 1rem; }
    .skill-row { display: grid; grid-template-columns: 160px 1fr; gap: 1rem; align-items: baseline; }
    .skill-cat { font-size: .78rem; font-weight: 500; letter-spacing: .04em; color: var(--ink-3); }
    .skill-items { font-size: .9rem; color: var(--ink-2); font-weight: 300; line-height: 1.6; }

    /* ── CONTACT ── */
    .contact-text { font-size: .95rem; color: var(--ink-2); line-height: 1.8; font-weight: 300; max-width: 48ch; margin-bottom: 1.75rem; }
