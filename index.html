<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Christina Tyagi — Neuroscience Researcher, Stanford University" />
  <title>Christina Tyagi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>

    /* ── TOKENS ── */
   :root {
    --bg:       #0A0E27;
    --bg-2:     #111632;
    --bg-card:  #141B3A;
    --white:    #ffffff;
    --border:   #1E2849;
  
    --ink:      #E8E9F3;
    --ink-2:    #B4B8D4;
    --ink-3:    #6B7199;
  
    --accent-1: #00F5FF;
    --accent-2: #7B61FF;
    --accent-3: #FF006B;
    --accent-glow: rgba(0, 245, 255, 0.2);
    
    --nav-h:    70px;
    --max:      900px;
    --sans:     'Space Grotesk', system-ui, sans-serif;
    --mono:     'JetBrains Mono', monospace;
  }

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body { 
      font-family: var(--sans); 
      background: var(--bg); 
      color: var(--ink); 
      line-height: 1.7; 
      -webkit-font-smoothing: antialiased; 
      position: relative;
      overflow-x: hidden;
    }
    
    /* Animated gradient background */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(123, 97, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 245, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(255, 0, 107, 0.06) 0%, transparent 50%);
      animation: gradientShift 20s ease infinite;
      z-index: -1;
      pointer-events: none;
    }
    
    @keyframes gradientShift {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(5%, -5%) rotate(120deg); }
      66% { transform: translate(-5%, 5%) rotate(240deg); }
    }
    
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }
    ::selection { background: var(--accent-1); color: var(--bg); }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: rgba(10, 14, 39, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid transparent;
      z-index: 100;
      transition: all .3s;
    }
    nav.scrolled { 
      border-bottom-color: var(--border); 
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }
    .nav-inner {
      max-width: calc(var(--max) + 4rem);
      margin: 0 auto; 
      padding: 0 2rem;
      height: 100%; 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
    }
    .nav-name { 
      font-family: var(--mono); 
      font-size: .85rem; 
      font-weight: 500; 
      white-space: nowrap; 
      margin-right: 2rem;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-links { display: flex; gap: .5rem; }
    .nav-links a {
      font-size: .75rem; 
      font-weight: 500; 
      letter-spacing: .08em; 
      text-transform: uppercase;
      color: var(--ink-3); 
      padding: .5rem .85rem; 
      border-radius: 8px;
      transition: all .2s;
      position: relative;
    }
    .nav-links a::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      transition: width .3s;
    }
    .nav-links a:hover, .nav-links a.active { 
      color: var(--accent-1);
    }
    .nav-links a.active::before {
      width: 60%;
    }

    /* mobile nav */
    .nav-toggle { 
      display: none; 
      flex-direction: column; 
      gap: 5px; 
      background: none; 
      border: none; 
      cursor: pointer; 
      padding: 4px; 
    }
    .nav-toggle span { 
      display: block; 
      width: 22px; 
      height: 2px; 
      background: var(--accent-1); 
      border-radius: 2px; 
      transition: transform .25s, opacity .2s; 
    }
    .nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .mobile-menu {
      display: none; 
      position: fixed; 
      top: var(--nav-h); 
      left: 0; 
      right: 0;
      background: rgba(10, 14, 39, 0.98); 
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem 2rem; 
      z-index: 99;
      animation: fadeDown .2s ease;
    }
    .mobile-menu.open { display: block; }
    .mobile-menu a { 
      display: block; 
      padding: .75rem .5rem; 
      font-size: .9rem; 
      color: var(--ink-2); 
      border-radius: 8px; 
      transition: all .2s; 
      letter-spacing: 0.02em;
    }
    .mobile-menu a:hover { 
      background: rgba(0, 245, 255, 0.1); 
      color: var(--accent-1); 
      padding-left: 1rem;
    }
    @keyframes fadeDown { 
      from { opacity: 0; transform: translateY(-10px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    /* ── PAGE WRAPPER ── */
    main { max-width: var(--max); margin: 0 auto; padding: 0 2rem; }

    /* ── SECTIONS ── */
    section { 
      padding: 5rem 0; 
      border-bottom: 1px solid var(--border); 
      position: relative;
    }
    section:last-child { border-bottom: none; }

    .sec-label {
      font-family: var(--mono); 
      font-size: .65rem; 
      font-weight: 500;
      letter-spacing: .15em; 
      text-transform: uppercase;
      color: var(--accent-1); 
      margin-bottom: 2rem; 
      display: inline-block;
      padding: .4rem .85rem;
      background: rgba(0, 245, 255, 0.08);
      border: 1px solid rgba(0, 245, 255, 0.2);
      border-radius: 6px;
    }
    
    h2 { 
      font-family: var(--sans); 
      font-size: 1.75rem; 
      font-weight: 600; 
      color: var(--ink); 
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }

    /* ── HERO ── */
    #about { 
      padding-top: calc(var(--nav-h) + 4rem); 
      padding-bottom: 5rem; 
    }
    
    .hero-container {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 3rem;
      align-items: start;
    }
    
    .hero-image {
      position: relative;
    }
    
    .hero-image::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3));
      border-radius: 16px;
      opacity: 0.3;
      filter: blur(20px);
      z-index: -1;
    }
    
    .hero-image img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      border: 2px solid var(--border);
      display: block;
    }
    
    .hero-name {
      font-family: var(--sans);
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700; 
      line-height: 1.1;
      color: var(--ink); 
      margin-bottom: 1rem;
      letter-spacing: -0.03em;
    }
    .hero-name em { 
      font-style: normal; 
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-sub { 
      font-family: var(--mono);
      font-size: .75rem; 
      color: var(--ink-3); 
      margin-bottom: 2rem;
      letter-spacing: 0.03em;
    }
    .hero-bio { 
      font-size: 1.05rem; 
      color: var(--ink-2); 
      line-height: 1.85; 
      font-weight: 300; 
      max-width: 60ch; 
      margin-bottom: 2.5rem; 
    }
    .hero-bio strong { 
      color: var(--ink); 
      font-weight: 500; 
    }
    .hero-link { 
      display: inline-flex; 
      align-items: center; 
      gap: .5rem; 
      font-size: .85rem; 
      font-weight: 500; 
      color: var(--ink); 
      border: 1.5px solid var(--accent-1); 
      padding: .7rem 1.4rem; 
      border-radius: 8px; 
      transition: all .3s;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.03em;
    }
    .hero-link::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      transition: left .3s;
      z-index: -1;
    }
    .hero-link:hover {
      color: var(--bg);
      border-color: transparent;
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .hero-link:hover::before {
      left: 0;
    }

    /* ── INTERESTS ── */
    .interests { 
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem; 
    }
    .interest { 
      display: flex; 
      align-items: flex-start; 
      gap: 1rem;
      padding: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: all .3s;
    }
    .interest:hover {
      border-color: var(--accent-1);
      box-shadow: 0 0 20px rgba(0, 245, 255, 0.1);
      transform: translateY(-2px);
    }
    .interest-dot { 
      width: 8px; 
      height: 8px; 
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      border-radius: 50%; 
      flex-shrink: 0; 
      margin-top: .5rem;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .interest p { 
      font-size: .95rem; 
      color: var(--ink-2); 
      font-weight: 300; 
      line-height: 1.6; 
    }
    .interest strong { 
      color: var(--accent-1); 
      font-weight: 600;
      display: block;
      margin-bottom: .25rem;
    }

    /* ── EXPERIENCE ── */
    .exp-list { 
      display: flex; 
      flex-direction: column; 
      gap: 3rem; 
    }
    .exp-item {
      padding: 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-2);
      border-radius: 12px;
      transition: all .3s;
    }

      border-left-color:
